<style>
    :root {
        --bg: #fff;
        --text: #1a1a1a;
        --muted: #666;
        --accent: #2b7fc4;
        --accent-hover: #1f6299;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #16181c;
            --text: #e8e8e8;
            --muted: #999;
            --accent: #3d7fc4;
            --accent-hover: #4f97dd;
        }
    }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        margin: 0 auto;
        max-width: 620px;
        padding: 48px 20px;
        line-height: 1.6;
        color: var(--text);
        background: var(--bg);
    }
    h1 {
        text-align: center;
        font-weight: 600;
        margin: 0 0 24px;
    }
    .intro {
        text-align: center;
        margin: 0 0 32px;
    }
    .footnote {
        text-align: center;
        margin: 40px 0 0;
        font-size: .9rem;
        color: var(--muted);
    }
    .footnote a {
        color: var(--muted);
    }
    .links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
    }
    .links a {
        text-decoration: none;
        color: #fff;
        background: var(--accent);
        padding: 10px 16px;
        min-width: 120px;
        text-align: center;
        transition: background .2s ease;
    }
    .links a:hover,
    .links a:focus-visible {
        background: var(--accent-hover);
    }
</style>

<body>

    </p>
